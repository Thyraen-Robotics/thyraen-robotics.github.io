name: sync-org-product-docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout org meta repo
        uses: actions/checkout@v4
        with:
          repository: Thyraen-Robotics/.github
          path: org-meta

      - name: Sync product markdown
        run: |
          set -euo pipefail
          mkdir -p content/products
          python3 - <<'PY'
          from pathlib import Path

          src_root = Path('org-meta/docs/products')
          dst_root = Path('content/products')

          products = [
              ('echelon', 'Echelon', 'Mission autonomy and command for objective-driven execution'),
              ('breacher', 'Breacher', 'Autonomous environment shaping for mission enablement'),
          ]

          for slug, title, hero_subtitle in products:
              src = src_root / f'{slug}.md'
              if not src.exists():
                  raise SystemExit(f'Missing source file: {src}')
              body = src.read_text(encoding='utf-8').rstrip() + '\n'
              front_matter = (
                  "+++\n"
                  f"title = \"{title}\"\n"
                  f"slug = \"{slug}\"\n"
                  "\n"
                  "[extra]\n"
                  f"hero_title = \"{title}\"\n"
                  f"hero_subtitle = \"{hero_subtitle}\"\n"
                  "+++\n\n"
              )
              notice = "<!-- synced from Thyraen-Robotics/.github; do not edit here -->\n\n"
              (dst_root / f'{slug}.md').write_text(front_matter + notice + body, encoding='utf-8')
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git config user.name "Thyraen Robotics Bot"
          git config user.email "actions@github.com"
          git add content/products/echelon.md content/products/breacher.md
          git commit -m "sync: products from .github"
          git push
