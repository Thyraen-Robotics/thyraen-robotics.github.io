name: sync-org-product-docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout org meta repo
        uses: actions/checkout@v4
        with:
          repository: Thyraen-Robotics/.github
          path: org-meta

      - name: Sync product markdown
        run: |
          set -euo pipefail
          mkdir -p content/products
          python3 - <<'PY'
          from pathlib import Path

          src_root = Path('org-meta/docs/products')
          dst_root = Path('content/products')

          products = [
              ('vanguard', 'Vanguard', 10,
               'The onboard autonomy and mission-computer runtime for unmanned systems',
               'Turns mission intent into bounded local action onboard the platform — mission reasoning, autopilot and payload command, sensing, and operator visibility, from simulation to fielded mission computer.'),
              ('echelon', 'Echelon', 20,
               'Situational awareness and tasking for heterogeneous autonomous platforms',
               'A contract-driven mission C2 control plane: canonical entities and tasks, strict reject-only validation, adapters for vehicles and tactical data feeds, and a 3D operator portal.'),
              ('tacit', 'Tacit', 30,
               'A quiet datalink for contested spectrum',
               'A low-probability-of-detection radio control plane linking vehicles with authenticated, reliable delivery at the minimum RF footprint the moment allows.'),
              ('dissident', 'Dissident', 40,
               'Vendor-free drone video, from goggles to the tactical map',
               'Captures encoded live drone video without vendor apps or firmware modification and republishes it as RTSP and Cursor-on-Target for ATAK and TAKX.'),
              ('simulator', 'Simulator', 50,
               'Fly it a thousand times before it ever leaves the rail',
               'Headless PX4/JSBSim flight truth paired with photoreal Unreal + Cesium sensor simulation, composable scenario registries, and gated validation with flight-log reports.'),
              ('crucible', 'Crucible', 60,
               'Raw material in, refined capability out',
               'A provenance-tracked data foundry turning raw sources into training-ready datasets and hardware-specific perception models with verifiable lineage.'),
              ('augur', 'Augur', 70,
               'The doctrine knowledge substrate',
               'Decomposes military doctrine into a cited, version-aware knowledge graph and answers doctrine questions with claims resolved to publication and paragraph — or an honest not-found.'),
              ('devstack', 'Devstack', 80,
               'One dashboard for every stack',
               'The shared engineering platform under every Thyraen repository: supervised process stacks, readiness gates, and fleet-wide dependency policy for humans and coding agents alike.'),
          ]

          expected = {f'{slug}.md' for slug, *_ in products} | {'_index.md'}
          for stale in dst_root.glob('*.md'):
              if stale.name not in expected:
                  stale.unlink()

          def toml_escape(value):
              return value.replace('\\', '\\\\').replace('"', '\\"')

          for slug, title, weight, hero_subtitle, card in products:
              src = src_root / f'{slug}.md'
              if not src.exists():
                  raise SystemExit(f'Missing source file: {src}')
              body = src.read_text(encoding='utf-8').rstrip() + '\n'
              front_matter = (
                  "+++\n"
                  f"title = \"{toml_escape(title)}\"\n"
                  f"slug = \"{slug}\"\n"
                  f"weight = {weight}\n"
                  "\n"
                  "[extra]\n"
                  f"hero_title = \"{toml_escape(title)}\"\n"
                  f"hero_subtitle = \"{toml_escape(hero_subtitle)}\"\n"
                  f"card = \"{toml_escape(card)}\"\n"
                  "masthead = \"/images/mastheads/org-masthead.png\"\n"
                  "+++\n\n"
              )
              notice = "<!-- synced from Thyraen-Robotics/.github; do not edit here -->\n\n"
              (dst_root / f'{slug}.md').write_text(front_matter + notice + body, encoding='utf-8')
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain content/products)" ]; then
            echo "No changes to sync."
            exit 0
          fi
          git config user.name "Thyraen Robotics Bot"
          git config user.email "actions@github.com"
          git add content/products
          git commit -m "sync: products from .github"
          git push
